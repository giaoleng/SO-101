name: source-and-contracts
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 "PyYAML>=6.0,<7" "mujoco==3.1.6" "glfw==2.7.0" "opencv-python-headless==4.10.0.84" "Pillow>=10,<12"
      - run: python scripts/verify_source.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/train/*.sh
